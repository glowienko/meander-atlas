spring:
  application:
    name: meander-atlas
  threads:
    virtual:
      enabled: true
  lifecycle:
    timeout-per-shutdown-phase: 20s
  task:
    execution:
      shutdown:
        await-termination: true
        await-termination-period: 20s
  mvc:
    problemdetails:
      enabled: true
  servlet:
    multipart:
      max-file-size: 256MB
      max-request-size: 256MB
  datasource:
    url: jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/${POSTGRES_DB:meander_atlas}
    username: ${POSTGRES_USER:meander}
    password: ${POSTGRES_PASSWORD:meander_local_dev}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      connection-timeout: 5000
  flyway:
    enabled: true
  modulith:
    events:
      jdbc:
        schema-initialization:
          enabled: true

server:
  port: ${APP_PORT:8080}
  shutdown: graceful
  forward-headers-strategy: framework
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        readiness:
          include: readinessState,db
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  default-produces-media-type: application/json
  writer-with-order-by-keys: true

app:
  imports-dir: ${APP_IMPORTS_DIR:${user.home}/meander-atlas-data/imports}
  boundaries-dir: ${APP_BOUNDARIES_DIR:${user.home}/meander-atlas-data/boundaries}
  boundaries-auto-seed: ${APP_BOUNDARIES_AUTO_SEED:true}
  default-user-id: ${APP_DEFAULT_USER_ID:00000000-0000-0000-0000-000000000001}
  enrichment:
    enabled: ${APP_ENRICHMENT_ENABLED:false}
    batch-size: ${APP_ENRICHMENT_BATCH_SIZE:25}
    max-retries: ${APP_ENRICHMENT_MAX_RETRIES:3}
    connect-timeout-ms: ${APP_ENRICHMENT_CONNECT_TIMEOUT_MS:5000}
    read-timeout-ms: ${APP_ENRICHMENT_READ_TIMEOUT_MS:30000}
    overpass-url: ${APP_ENRICHMENT_OVERPASS_URL:https://overpass-api.de/api/interpreter}
    photon-url: ${APP_ENRICHMENT_PHOTON_URL:https://photon.komoot.io/api}
    wikimedia-commons-api-url: ${APP_ENRICHMENT_WIKIMEDIA_COMMONS_URL:https://commons.wikimedia.org/w/api.php}
    wikipedia-rest-url-template: ${APP_ENRICHMENT_WIKIPEDIA_REST_URL_TEMPLATE:https://{lang}.wikipedia.org/api/rest_v1}
    wikidata-api-url: ${APP_ENRICHMENT_WIKIDATA_URL:https://www.wikidata.org/w/api.php}
    wikimedia-user-agent: ${APP_ENRICHMENT_WIKIMEDIA_USER_AGENT:MeanderAtlas/0.1 (local-personal-atlas)}
