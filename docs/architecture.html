<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MeanderAtlas — Interactive Architecture Explorer</title>
  <style>
    :root {
      --background: #FAF9F6;
      --card: #FFFFFF;
      --content: #F4F2EC;
      --border: #DDD8CC;
      --card-border: #E7E3D8;
      --foreground: #1C1917;
      --muted-foreground: #57534E;
      --code-foreground: #292524;
      --primary: #1D4ED8;
      --primary-foreground: #FFFFFF;
      --link: #1D4ED8;
      --warning: #D97706;
      --chart-1: #2563EB;
      --chart-2: #0D9488;
      --chart-3: #7C3AED;
      --chart-4: #EA580C;
      --chart-5: #4F46E5;
      --chart-6: #64748B;
    }

    :root[data-theme="dark"] {
      --background: #141311;
      --card: #1C1B18;
      --content: #25231F;
      --border: #38342D;
      --card-border: #2F2C26;
      --foreground: #F5F3EE;
      --muted-foreground: #A8A29E;
      --code-foreground: #E7E5E4;
      --primary: #60A5FA;
      --primary-foreground: #0F172A;
      --link: #93C5FD;
      --warning: #FBBF24;
      --chart-1: #60A5FA;
      --chart-2: #2DD4BF;
      --chart-3: #A78BFA;
      --chart-4: #FB923C;
      --chart-5: #818CF8;
      --chart-6: #94A3B8;
    }

    *, *::before, *::after {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      background: var(--background);
      color: var(--foreground);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, Helvetica, Arial, sans-serif;
      font-size: 14px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    button, input {
      font: inherit;
      color: inherit;
    }

    button {
      cursor: pointer;
    }

    .page-shell {
      max-width: 1440px;
      margin: 0 auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
    }

    .header-card {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .header-top {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-icon {
      width: 36px;
      height: 36px;
      border-radius: 8px;
      background: var(--content);
      border: 1px solid var(--card-border);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .title-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }

    .page-title {
      margin: 0;
      font-size: 16px;
      font-weight: 600;
      letter-spacing: -0.01em;
    }

    .subtitle {
      margin: 2px 0 0;
      font-size: 12px;
      color: var(--muted-foreground);
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      padding: 2px 8px;
      border-radius: 9999px;
      background: var(--content);
      border: 1px solid var(--card-border);
      color: var(--muted-foreground);
    }

    .mono {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }

    .controls-group {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .search-wrap {
      position: relative;
      width: 288px;
      max-width: 100%;
    }

    .search-input {
      width: 100%;
      font-size: 12px;
      padding: 8px 12px;
      border-radius: 8px;
      background: var(--content);
      border: 1px solid var(--card-border);
      color: var(--foreground);
      outline: none;
    }

    .search-input::placeholder {
      color: var(--muted-foreground);
    }

    .search-input:focus {
      border-color: var(--primary);
    }

    .search-dropdown {
      position: absolute;
      left: 0;
      right: 0;
      top: calc(100% + 4px);
      z-index: 30;
      max-height: 288px;
      overflow-y: auto;
      border-radius: 8px;
      background: var(--card);
      border: 1px solid var(--border);
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.14);
    }

    .search-item {
      width: 100%;
      text-align: left;
      padding: 10px;
      border: 0;
      border-bottom: 1px solid var(--card-border);
      background: transparent;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .search-item:last-child {
      border-bottom: 0;
    }

    .search-item:hover {
      background: var(--content);
    }

    .btn-secondary {
      font-size: 12px;
      padding: 8px 12px;
      border-radius: 8px;
      background: var(--content);
      border: 1px solid var(--card-border);
      color: var(--muted-foreground);
      white-space: nowrap;
    }

    .btn-secondary:hover {
      color: var(--foreground);
      border-color: var(--border);
    }

    .btn-primary {
      width: 100%;
      font-size: 12px;
      font-weight: 500;
      padding: 7px 12px;
      border-radius: 8px;
      border: 0;
      background: var(--primary);
      color: var(--primary-foreground);
    }

    .nav-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding-top: 10px;
      border-top: 1px solid var(--card-border);
    }

    .tab-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .tab-btn {
      font-size: 12px;
      font-weight: 500;
      padding: 6px 12px;
      border-radius: 8px;
      border: 1px solid var(--card-border);
      background: var(--content);
      color: var(--muted-foreground);
    }

    .tab-btn:hover {
      color: var(--foreground);
    }

    .tab-btn.active {
      background: var(--primary);
      border-color: var(--primary);
      color: var(--primary-foreground);
    }

    .legend {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 12px;
      font-size: 12px;
      color: var(--muted-foreground);
    }

    .legend-item {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .legend-swatch {
      width: 10px;
      height: 10px;
      border-radius: 2px;
      display: inline-block;
    }

    .workspace-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
      align-items: start;
    }

    @media (min-width: 1024px) {
      .workspace-grid {
        grid-template-columns: minmax(0, 1fr) 360px;
      }
      .inspector-card {
        position: sticky;
        top: 16px;
      }
    }

    .stage-card {
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .view-toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--card-border);
    }

    .filter-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .filter-btn {
      font-size: 12px;
      padding: 4px 10px;
      border-radius: 6px;
      border: 1px solid var(--card-border);
      background: var(--content);
      color: var(--muted-foreground);
    }

    .filter-btn:hover {
      color: var(--foreground);
    }

    .filter-btn.active {
      background: var(--primary);
      border-color: var(--primary);
      color: var(--primary-foreground);
      font-weight: 500;
    }

    .stage-scroll {
      width: 100%;
      overflow-x: auto;
    }

    .inspector-card {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .inspector-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--card-border);
      padding-bottom: 8px;
    }

    .inspector-title {
      margin: 0;
      font-size: 14px;
      font-weight: 600;
    }

    .inspector-body {
      display: flex;
      flex-direction: column;
      gap: 12px;
      font-size: 12px;
    }

    .path-box {
      border-radius: 8px;
      background: var(--content);
      border: 1px solid var(--card-border);
      padding: 8px;
      font-size: 12px;
      color: var(--code-foreground);
      word-break: break-word;
    }

    .section-divider {
      padding-top: 10px;
      border-top: 1px solid var(--card-border);
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .section-kicker {
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--muted-foreground);
    }

    .chip-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .chip-btn {
      font-size: 12px;
      padding: 4px 8px;
      border-radius: 6px;
      background: var(--content);
      border: 1px solid var(--card-border);
      color: var(--foreground);
    }

    .chip-btn:hover {
      border-color: var(--primary);
    }

    .flow-list {
      max-width: 760px;
      display: flex;
      flex-direction: column;
    }

    .flow-card {
      width: 100%;
      text-align: left;
      border-radius: 12px;
      padding: 14px;
      background: var(--content);
      border: 1px solid var(--card-border);
      transition: border-color 150ms ease;
    }

    .flow-card:hover,
    .flow-card.selected {
      border-color: var(--primary);
    }

    .flow-card.selected {
      box-shadow: 0 0 0 1px var(--primary);
    }

    .flow-arrow {
      display: flex;
      justify-content: center;
      padding: 4px 0;
    }

    .fe-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 8px;
    }

    .fe-card {
      text-align: left;
      border-radius: 8px;
      padding: 10px;
      background: var(--content);
      border: 1px solid var(--card-border);
    }

    .fe-card:hover,
    .fe-card.selected {
      border-color: var(--primary);
    }

    .fe-card.selected {
      box-shadow: 0 0 0 1px var(--primary);
    }

    .svg-board {
      width: 100%;
      height: auto;
      user-select: none;
      display: block;
    }

    .svg-node {
      cursor: pointer;
      transition: opacity 150ms ease;
    }

    .svg-node:hover rect.node-bg {
      stroke-width: 2.2;
    }

    .svg-edge {
      fill: none;
      transition: opacity 150ms ease, stroke-width 150ms ease;
      pointer-events: none;
    }

    .dimmed {
      opacity: 0.22;
    }

    .edge-dimmed {
      opacity: 0.08;
    }

    .edge-active {
      opacity: 0.95;
      stroke-width: 2.2;
    }

    .hidden {
      display: none !important;
    }

    ul.fn-list {
      margin: 0;
      padding-left: 18px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
  </style>
</head>
<body>
  <div class="page-shell">
    <header class="card header-card">
      <div class="header-top">
        <div class="brand-group">
          <div class="brand-icon" aria-hidden="true">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--chart-1)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="9"></circle>
              <path d="M3 12h18"></path>
              <path d="M12 3a13 13 0 0 1 0 18"></path>
              <path d="M12 3a13 13 0 0 0 0 18"></path>
            </svg>
          </div>
          <div>
            <div class="title-row">
              <h1 class="page-title">MeanderAtlas Codebase Explorer</h1>
              <span class="pill mono">v0.1 · PR #14</span>
            </div>
            <p class="subtitle">
              Spring Boot 4.1 Modulith + PostGIS 3.5 + React 19 / MapLibre GL JS — click any block, class, flow step, or table to trace dependencies.
            </p>
          </div>
        </div>

        <div class="controls-group">
          <div class="search-wrap">
            <input
              id="global-search"
              type="search"
              placeholder="Search class, endpoint, table, hook..."
              class="search-input"
            />
            <div id="search-results" class="search-dropdown hidden"></div>
          </div>
          <button id="theme-toggle-btn" type="button" class="btn-secondary">Dark Mode</button>
          <button id="clear-selection-btn" type="button" class="btn-secondary">Reset</button>
        </div>
      </div>

      <nav class="nav-row">
        <div id="tab-bar" class="tab-bar"></div>
        <div class="legend">
          <span class="legend-item"><span class="legend-swatch" style="background:var(--chart-1)"></span>atlas</span>
          <span class="legend-item"><span class="legend-swatch" style="background:var(--chart-2)"></span>ingestion</span>
          <span class="legend-item"><span class="legend-swatch" style="background:var(--chart-3)"></span>shared</span>
          <span class="legend-item"><span class="legend-swatch" style="background:var(--chart-4)"></span>frontend / edge</span>
          <span class="legend-item"><span class="legend-swatch" style="background:var(--chart-5)"></span>database / disk</span>
        </div>
      </nav>
    </header>

    <main class="workspace-grid">
      <section class="card stage-card">
        <div id="view-toolbar" class="view-toolbar"></div>
        <div id="view-stage" class="stage-scroll"></div>
      </section>

      <aside class="card inspector-card">
        <div class="inspector-header">
          <h2 class="inspector-title">Inspector</h2>
          <span id="inspector-badge" class="pill">Select a node</span>
        </div>
        <div id="inspector-body" class="inspector-body"></div>
      </aside>
    </main>
  </div>

  <script>
    const MODULE_COLORS = {
      atlas: "var(--chart-1)",
      ingestion: "var(--chart-2)",
      shared: "var(--chart-3)",
      frontend: "var(--chart-4)",
      database: "var(--chart-5)",
      infra: "var(--chart-6)"
    };

    const NODES = {
      "hl-frontend": {
        id: "hl-frontend",
        title: "React 19 + MapLibre SPA",
        module: "frontend",
        layer: "Client UI",
        tab: "overview",
        path: "frontend/src/App.tsx",
        tx: null,
        summary: "Warm-Paper (#FAF9F6) interactive globe & map client. Syncs filters and active region into URL query params, renders places and vector region polygons via raw MapLibre GL JS, and coordinates mutations via TanStack Query + typed openapi-fetch.",
        functions: [
          "AtlasShell (App.tsx) — top-level state, selection, undo toast, bulk dialog",
          "AtlasMapView — raw MapLibre globe/mercator + MVT /api/v1/atlas/tiles/regions/{level}/{z}/{x}/{y}.mvt",
          "viewState.ts — URL <-> AtlasViewState + antimeridian isPlaceInViewport()",
          "features/atlas/* & features/ingestion/* — UI panels & query hooks"
        ],
        dependsOn: ["hl-edge", "hl-atlas-web", "hl-ingestion-web"],
        jumpTab: "frontend-db",
        jumpLabel: "Open Frontend & DB View"
      },
      "hl-edge": {
        id: "hl-edge",
        title: "Caddy 2 + OpenAPI Contract Loop",
        module: "infra",
        layer: "Edge & Type Safety",
        tab: "overview",
        path: "contracts/openapi.json -> frontend/src/api/schema.d.ts",
        tx: null,
        summary: "Caddy proxies /api/v1/* and MVT tiles to the Spring Boot backend and serves static SPA assets. Build-time OpenAPI drift checks guarantee the TypeScript client matches Spring MVC controllers.",
        functions: [
          "OpenApiExportTest generates contracts/openapi.json from SpringDoc",
          "pnpm --dir frontend run gen:api generates frontend/src/api/schema.d.ts",
          "api/client.ts wraps openapi-fetch with typed query/body helpers",
          "verify.sh fails on OpenAPI or schema.d.ts drift"
        ],
        dependsOn: ["hl-atlas-web", "hl-ingestion-web"],
        jumpTab: "frontend-db",
        jumpLabel: "Inspect API Client"
      },
      "hl-ingestion-web": {
        id: "hl-ingestion-web",
        title: "ingestion Module",
        module: "ingestion",
        layer: "Spring Modulith (@ApplicationModule)",
        tab: "overview",
        path: "backend/src/main/java/com/meanderatlas/ingestion/",
        tx: "TransactionOperations (two-pass import)",
        summary: "Imports Google Takeout (Saved Places JSON, Reviews JSON, Saved CSVs) and Timeline.json from local disk, deduplicates accounts by SHA-256, queues unresolved coordinate jobs, and delegates canonical place merging + Timeline reconciliation to AtlasFacade.",
        functions: [
          "ImportController: POST /api/v1/imports/local, GET /api/v1/imports/status",
          "ImportFacade -> ImportLocalDirectory & GetImportStatus",
          "Parsers: TakeoutGeoJsonParser, TakeoutCsvParser, CsvRecordReader, TimelineParser, GoogleCidDecoder, PlaceCategoryClassifier",
          "Allowed dependencies: shared + atlas (only via AtlasFacade)"
        ],
        dependsOn: ["hl-atlas-facade", "hl-shared", "hl-db-ingestion", "hl-disk-imports"],
        jumpTab: "backend",
        jumpLabel: "Explore ingestion in Backend Map"
      },
      "hl-atlas-web": {
        id: "hl-atlas-web",
        title: "atlas Web & Startup Entry Points",
        module: "atlas",
        layer: "Web Adapters & Runners",
        tab: "overview",
        path: "backend/src/main/java/com/meanderatlas/atlas/adapter/web/",
        tx: null,
        summary: "5 Spring MVC controllers + RFC 9457 ProblemDetail exception handler + startup BoundaryAutoSeeder. Every controller delegates exclusively to AtlasFacade.",
        functions: [
          "AtlasPlacesController: GET /places, PATCH /{id}/visit-status, PATCH /bulk-visit-status, POST /bulk-visit-status/restore",
          "AtlasRegionsController: GET /regions, GET /regions/{level}/{code}",
          "AtlasBoundariesController: POST /boundaries/seed, GET /tiles/regions/{level}/{z}/{x}/{y}.mvt",
          "AtlasStatsController & AtlasHealthController + BoundaryAutoSeeder"
        ],
        dependsOn: ["hl-atlas-facade"],
        jumpTab: "backend",
        jumpLabel: "Explore Controllers in Backend Map"
      },
      "hl-atlas-facade": {
        id: "hl-atlas-facade",
        title: "atlas Module (Core Domain & Spatial Engine)",
        module: "atlas",
        layer: "Spring Modulith (@ApplicationModule)",
        tab: "overview",
        path: "backend/src/main/java/com/meanderatlas/atlas/",
        tx: "@Transactional / @Transactional(readOnly=true) / TransactionOperations",
        summary: "Owns canonical places, memberships, visit states, and Natural Earth boundaries. All public cross-module entry points sit on AtlasFacade (13 methods), backed by single-use-case application services, pure Java 25 domain logic, and NamedParameterJdbcTemplate PostGIS repositories.",
        functions: [
          "AtlasFacade: single public module API (checked by ArchitectureTest)",
          "Use cases: QueryAtlasPlaces, GetRegionSummaries, GetRegionDossier, GetAtlasStats, UpdatePlaceVisitStatus, BulkUpdatePlaceVisitStatus, RestorePlaceVisitStates, UpsertImportedPlace, AttachCsvMembershipByCid, ReconcileTimelineVisit, SeedRegionBoundaries, GetRegionMvtTile, GetAtlasHealth",
          "Domain: PlaceVisitState, DerivedRoleResolver, NaturalEarthGeoJsonParser, BoundingBox",
          "Allowed dependencies: shared only"
        ],
        dependsOn: ["hl-shared", "hl-db-atlas", "hl-disk-boundaries"],
        jumpTab: "backend",
        jumpLabel: "Explore atlas Internals"
      },
      "hl-shared": {
        id: "hl-shared",
        title: "shared Kernel",
        module: "shared",
        layer: "Shared Primitives & Enums",
        tab: "overview",
        path: "backend/src/main/java/com/meanderatlas/shared/",
        tx: null,
        summary: "Cross-module value primitives, domain enums, and CurrentUserProvider SPI. Neither atlas nor ingestion domain classes import Spring or JDBC; shared holds types safe for facades and domain models alike.",
        functions: [
          "Value objects: UserId, PlaceId, GeoPoint (validates lat/lng bounds)",
          "Enums: PlaceCategory, CategorySource, DerivedRole, ListKind, VisitStatus, VisitSource (outranks precedence), CoordSource",
          "CurrentUserProvider + ConfiguredCurrentUserProvider (single-user v0.1 config)"
        ],
        dependsOn: [],
        jumpTab: "backend",
        jumpLabel: "Inspect in Backend Map"
      },
      "hl-db-atlas": {
        id: "hl-db-atlas",
        title: "PostgreSQL 17 + PostGIS (atlas tables)",
        module: "database",
        layer: "Persistence Schema",
        tab: "overview",
        path: "backend/src/main/resources/db/migration/V1..V3",
        tx: "Owned by atlas",
        summary: "Stores canonical Point(4326) places, visit state machine rows, multi-account list memberships, and MultiPolygon(4326) Natural Earth boundaries with geometry & geography GiST indexes and pg_trgm trigram index.",
        functions: [
          "places (geom GiST, geom::geography GiST, canonical_name GIN trgm, unique user+google_place_id / user+google_cid)",
          "place_visit_state (PK/FK place_id, CHECK invariants for UNVISITED / NEEDS_TRIAGE / VISITED)",
          "place_memberships (UNIQUE place_id + account_label + list_name)",
          "region_boundaries (geom + simplified_geom + geom::geography GiST)"
        ],
        dependsOn: [],
        jumpTab: "frontend-db",
        jumpLabel: "Open PostGIS Schema"
      },
      "hl-db-ingestion": {
        id: "hl-db-ingestion",
        title: "PostgreSQL 17 (ingestion tables)",
        module: "database",
        layer: "Persistence Schema",
        tab: "overview",
        path: "backend/src/main/resources/db/migration/V2__living_atlas_schema.sql",
        tx: "Owned by ingestion",
        summary: "Tracks idempotent import batches by content SHA-256, raw parsed JSONB records, and pending coordinate-lookup jobs for rows without coordinates or CID match.",
        functions: [
          "import_batches (UNIQUE user_id + account_label + content_sha256)",
          "import_records (FK batch_id ON DELETE CASCADE, payload_json JSONB)",
          "resolution_jobs (partial queue index WHERE status = 'PENDING')"
        ],
        dependsOn: [],
        jumpTab: "frontend-db",
        jumpLabel: "Open PostGIS Schema"
      },
      "hl-disk-imports": {
        id: "hl-disk-imports",
        title: "Local Takeout & Timeline Files",
        module: "infra",
        layer: "External Filesystem (APP_IMPORTS_DIR)",
        tab: "overview",
        path: "${user.home}/meander-atlas-data/imports",
        tx: null,
        summary: "Per-account subdirectories containing raw Google Takeout Saved Places.json, Reviews.json, Saved CSV lists, and Timeline.json semanticSegments.",
        functions: [
          "Read by LocalDirectoryImportAdapter",
          "SHA-256 computed across relative path + file bytes for idempotency",
          "Never committed to git (enforced by scripts/check-privacy.sh)"
        ],
        dependsOn: []
      },
      "hl-disk-boundaries": {
        id: "hl-disk-boundaries",

    function esc(s) {
      return String(s)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function computeChain(rootId, poolIds) {
      if (!rootId || !NODES[rootId]) return null;
      const allowed = new Set(poolIds);
      if (!allowed.has(rootId)) return null;
      const up = new Set();
      const down = new Set();
      const qUp = [rootId];
      while (qUp.length) {
        const cur = qUp.shift();
        (NODES[cur]?.usedBy || []).forEach((p) => {
          if (allowed.has(p) && !up.has(p)) {
            up.add(p);
            qUp.push(p);
          }
        });
      }
      const qDown = [rootId];
      while (qDown.length) {
        const cur = qDown.shift();
        (NODES[cur]?.dependsOn || []).forEach((c) => {
          if (allowed.has(c) && !down.has(c)) {
            down.add(c);
            qDown.push(c);
          }
        });
      }
      return { rootId, up, down, related: new Set([rootId, ...up, ...down]) };
    }

    function setupThemeToggle() {
      const btn = document.getElementById("theme-toggle-btn");
      const prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
      let theme = prefersDark ? "dark" : "light";

      function applyTheme(next) {
        theme = next;
        if (theme === "dark") {
          document.documentElement.setAttribute("data-theme", "dark");
          btn.textContent = "Light Mode";
        } else {
          document.documentElement.removeAttribute("data-theme");
          btn.textContent = "Dark Mode";
        }
      }

      applyTheme(theme);
      btn.addEventListener("click", () => applyTheme(theme === "dark" ? "light" : "dark"));
    }

    function renderTabs() {
      const bar = document.getElementById("tab-bar");
      bar.innerHTML = TABS.map((t) => {
        const active = state.tab === t.id;
        return `<button type="button" data-tab="${t.id}" class="tab-btn ${active ? "active" : ""}">${esc(t.label)}</button>`;
      }).join("");
      bar.querySelectorAll("button").forEach((btn) => {
        btn.addEventListener("click", () => {
          state.tab = btn.dataset.tab;
          if (state.tab === "overview" && (!NODES[state.selectedId] || NODES[state.selectedId].tab !== "overview")) {
            state.selectedId = "hl-atlas-facade";
          } else if (state.tab === "backend" && (!NODES[state.selectedId] || NODES[state.selectedId].col === undefined)) {

            state.selectedId = "fe-app";
          }
          renderAll();
        });
      });
    }

      const edgeSvg = edges.map((e) => {
        const a = boxMap[e.from];

        const x1 = a.x + a.w / 2;
        const y1 = a.y + a.h / 2;
        const x2 = b.x + b.w / 2;
        const y2 = b.y + b.h / 2;
        const mx = (x1 + x2) / 2;
        const my = (y1 + y2) / 2;
        const active = chain && chain.related.has(e.from) && chain.related.has(e.to);
        const cls = chain ? (active ? "svg-edge edge-active" : "svg-edge edge-dimmed") : "svg-edge";
        const stroke = active ? MODULE_COLORS[NODES[e.from].module] : "var(--border)";
        return `
          <g>
            <line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" class="${cls}" stroke="${stroke}" stroke-width="1.6" marker-end="url(#arrow)" />

    function renderBackend() {
      const filters = [
        { id: "all", label: "All Classes" },
        { id: "atlas", label: "atlas module" },
        { id: "ingestion", label: "ingestion module" },
        { id: "shared", label: "shared kernel" },
        { id: "write-tx", label: "Write Tx" },
        { id: "read-tx", label: "Read-Only Tx" }
      ];

      const toolbar = document.getElementById("view-toolbar");
      toolbar.innerHTML = `
        <div class="filter-pills">
          ${filters.map((f) => `
            <button type="button" data-filter="${f.id}" class="filter-btn ${state.backendFilter === f.id ? "active" : ""}">${esc(f.label)}</button>
          `).join("")}
        </div>
        <div class="subtitle" style="margin:0;">Click any node to isolate its callers &amp; dependencies</div>
      `;

      toolbar.querySelectorAll("[data-filter]").forEach((btn) => {
        btn.addEventListener("click", () => {
          state.backendFilter = btn.dataset.filter;
          renderBackend();
        });
      });

      const backendNodes = Object.values(NODES).filter((n) => n.col !== undefined);
      const colHeaders = [
        "1. Entry Points",
        "2. Facades",
        "3. Use Cases & Helpers",
        "4. Pure Domain & Ports",
        "5. JDBC / FS & Tables"
      ];
      const colX = [16, 236, 456, 696, 936];
      const colW = [196, 196, 216, 216, 216];
      const boxH = 44;
      const gapY = 10;

      const byCol = [[], [], [], [], []];
      backendNodes.forEach((n) => byCol[n.col].push(n));
      byCol.forEach((list) => list.sort((a, b) => a.row - b.row));

      const coords = {};
      let maxH = 0;
      byCol.forEach((list, c) => {
        const total = list.length * boxH + Math.max(0, list.length - 1) * gapY;
        const startY = c === 1 ? 230 : 48;
        list.forEach((n, idx) => {
          const y = startY + idx * (boxH + gapY);
          coords[n.id] = { x: colX[c], y, w: colW[c], h: boxH };
          maxH = Math.max(maxH, y + boxH + 24);
        });
        maxH = Math.max(maxH, startY + total + 24);
      });

      const chain = computeChain(state.selectedId, backendNodes.map((n) => n.id));

      function matchesFilter(n) {
        if (state.backendFilter === "all") return true;
        if (state.backendFilter === "write-tx") {
          return n.tx === "@Transactional" || n.tx === "TransactionOperations" || (n.tx || "").includes("Joins caller");
        }
        if (state.backendFilter === "read-tx") {
          return (n.tx || "").includes("readOnly");
        }
        return n.module === state.backendFilter;
      }

      const headersSvg = colHeaders.map((title, c) => `
        <text x="${colX[c] + 4}" y="26" fill="var(--muted-foreground)" font-size="12" font-weight="600">${esc(title)}</text>
      `).join("");

      const edgesSvg = [];
      backendNodes.forEach((n) => {
        const from = coords[n.id];
        (n.dependsOn || []).forEach((targetId) => {
          const to = coords[targetId];
          if (!to) return;
          const x1 = from.x + from.w;
          const y1 = from.y + from.h / 2;
          const x2 = to.x;
          const y2 = to.y + to.h / 2;
          const cx = (x1 + x2) / 2;
          const active = chain && chain.related.has(n.id) && chain.related.has(targetId);
          const filterMatch = matchesFilter(n) || matchesFilter(NODES[targetId]);
          const cls = chain
            ? (active ? "svg-edge edge-active" : "svg-edge edge-dimmed")
            : (filterMatch ? "svg-edge" : "svg-edge edge-dimmed");
          const stroke = active ? MODULE_COLORS[n.module] : "var(--border)";
          edgesSvg.push(`<path d="M ${x1} ${y1} C ${cx} ${y1}, ${cx} ${y2}, ${x2} ${y2}" class="${cls}" stroke="${stroke}" stroke-width="1.3" />`);
        });
      });

      const nodesSvg = backendNodes.map((n) => {
        const box = coords[n.id];
        const color = MODULE_COLORS[n.module];
        const isSelected = state.selectedId === n.id;
        const visibleByFilter = matchesFilter(n);
        const visibleByChain = !chain || chain.related.has(n.id);
        const dimmed = !(visibleByFilter && visibleByChain);
        const txTag = n.tx
          ? (n.tx.includes("readOnly") ? "RO" : n.tx.includes("TransactionOperations") ? "TxOps" : n.tx.includes("@Transactional") ? "@Tx" : "")
          : "";
        return `
          <g class="svg-node ${dimmed ? "dimmed" : ""}" data-node="${n.id}">
            <rect
              class="node-bg"
              x="${box.x}" y="${box.y}" width="${box.w}" height="${box.h}" rx="7"
              fill="var(--content)"
              stroke="${isSelected ? "var(--primary)" : color}"
              stroke-width="${isSelected ? 2.4 : 1.3}"
            />
            <rect x="${box.x}" y="${box.y}" width="4" height="${box.h}" rx="2" fill="${color}" />
            <text x="${box.x + 10}" y="${box.y + 18}" fill="var(--foreground)" font-size="12" font-weight="600">${esc(n.title)}</text>
            <text x="${box.x + 10}" y="${box.y + 34}" fill="var(--muted-foreground)" font-size="12">${esc(n.layer)}${txTag ? " · " + txTag : ""}</text>
          </g>
        `;
      }).join("");

      document.getElementById("view-stage").innerHTML = `
        <svg viewBox="0 0 1168 ${maxH}" class="svg-board" style="min-width:1040px;">
          ${headersSvg}
          ${edgesSvg.join("")}
          ${nodesSvg}
        </svg>
      `;

      document.querySelectorAll("[data-node]").forEach((el) => {
        el.addEventListener("click", () => selectNode(el.dataset.node));
      });
    }

            <button type="button" id="inspector-jump-tab" class="btn-primary">
              ${esc(node.jumpLabel || "Open Detail View")}
            </button>
          ` : ""}
        </div>

        <div class="section-divider">
          <div class="section-kicker">Key Functions &amp; Contracts</div>
          <ul class="fn-list">
            ${(node.functions || []).map((fn) => `<li>${esc(fn)}</li>`).join("")}
          </ul>
        </div>

        <div class="section-divider">
          <div class="section-kicker">Depends On</div>
          <div class="chip-row">${depsHtml}</div>
        </div>

        <div class="section-divider">
          <div class="section-kicker">Used By</div>
          <div class="chip-row">${usedByHtml}</div>
        </div>
      `;

      body.querySelectorAll("[data-jump]").forEach((btn) => {
        btn.addEventListener("click", () => {
          const target = btn.dataset.jump;
          const tNode = NODES[target];
          let nextTab = state.tab;
          if (tNode.tab === "overview" && state.tab !== "overview") nextTab = "overview";
          else if (tNode.col !== undefined) nextTab = "backend";
          else if (target.startsWith("fe-") || target.startsWith("db-")) nextTab = "frontend-db";
          selectNode(target, nextTab);
        });
      });

      const jumpBtn = document.getElementById("inspector-jump-tab");
      if (jumpBtn && node.jumpTab) {
        jumpBtn.addEventListener("click", () => {
          state.tab = node.jumpTab;
          if (node.jumpTab === "backend") state.selectedId = "AtlasFacade";
          if (node.jumpTab === "frontend-db") state.selectedId = node.module === "database" ? "db-places" : "fe-app";
          renderAll();
        });
      }
    }

    function setupSearch() {
      const input = document.getElementById("global-search");
      const results = document.getElementById("search-results");

      input.addEventListener("input", () => {
        const q = input.value.trim().toLowerCase();
        if (!q) {
          results.classList.add("hidden");
          results.innerHTML = "";
          return;
        }
        const matches = Object.values(NODES).filter((n) => {
          const hay = [n.title, n.path, n.summary, ...(n.functions || [])].join(" ").toLowerCase();
          return hay.includes(q);
        }).slice(0, 10);

        if (!matches.length) {
          results.innerHTML = `<div style="padding:10px;font-size:12px;color:var(--muted-foreground);">No matching nodes found.</div>`;
        } else {
          results.innerHTML = matches.map((m) => `
            <button type="button" data-pick="${m.id}" class="search-item">
              <div style="min-width:0;">
                <div style="font-size:12px;font-weight:600;color:var(--foreground);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${esc(m.title)}</div>
                <div class="mono" style="font-size:12px;color:var(--muted-foreground);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${esc(m.path)}</div>
              </div>
              <span class="pill" style="flex-shrink:0;">${esc(m.module)}</span>
            </button>
          `).join("");
          results.querySelectorAll("[data-pick]").forEach((btn) => {
            btn.addEventListener("click", () => {
              const id = btn.dataset.pick;
              const n = NODES[id];
              let tab = "overview";
              if (n.col !== undefined) tab = "backend";
              else if (id.startsWith("fe-") || id.startsWith("db-")) tab = "frontend-db";
              results.classList.add("hidden");
              input.value = "";
              selectNode(id, tab);
            });
          });
        }
        results.classList.remove("hidden");
      });

      document.addEventListener("click", (e) => {
        if (!results.contains(e.target) && e.target !== input) {
          results.classList.add("hidden");
        }
      });

      document.getElementById("clear-selection-btn").addEventListener("click", () => {
        state.selectedId = null;
        state.backendFilter = "all";
        renderAll();
      });
    }

    function renderAll() {
      renderTabs();
      if (state.tab === "overview") renderOverview();
      else if (state.tab === "backend") renderBackend();
      else if (state.tab === "flows") renderFlows();
      else renderFrontendAndDb();
      renderInspector();
    }

    setupThemeToggle();
    setupSearch();
    renderAll();
  </script>
</body>
</html>
